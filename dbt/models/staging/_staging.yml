version: 2

models:
  - name: stg_postgres__customers
    description: "One row per customer, cleaned."
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]

  - name: stg_postgres__products
    description: "One row per product."
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: list_price_usd
        tests: [not_null]

  - name: stg_postgres__orders
    description: "One row per order header."
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_postgres__customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['placed', 'shipped', 'delivered', 'cancelled', 'returned']

  - name: stg_postgres__order_items
    description: "One row per line item within an order."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_postgres__orders')
              field: order_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_postgres__products')
              field: product_id

  - name: stg_s3__web_events
    description: "Clickstream events; customer_id null for anonymous sessions."
    columns:
      - name: event_id
        tests: [unique, not_null]

  - name: stg_s3__marketing_spend
    description: "Daily marketing spend by channel."
    columns:
      - name: channel
        tests: [not_null]

  - name: stg_api__fx_rates
    description: "Daily USD-based FX reference rates."
    columns:
      - name: rate_to_usd
        tests: [not_null]
